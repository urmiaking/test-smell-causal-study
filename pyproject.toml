[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team7-pipeline"
version = "0.1.0"
description = "Reproducible empirical pipeline for Team 7 causal test smell research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyDriller>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
team7 = "team7_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
